[project]
name = "abides-ui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "abides-hasufel",
    "numpy>=1.26.0",
    "pandas>=2.2.0,<3.0.0",
    "pandera>=0.22.0",
    "plotly>=6.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "streamlit>=1.45.0",
]

[project.urls]
Homepage = "https://github.com/GabrieleDiCorato/abides-ui"
Repository = "https://github.com/GabrieleDiCorato/abides-ui"
Issues = "https://github.com/GabrieleDiCorato/abides-ui/issues"


[project.scripts]
ui = "abides_ui._cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "ipykernel>=7.1.0",
    "nbstripout>=0.9.0",
    "pyright>=1.1.408",
    "pytest-xdist>=3.8.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abides_ui"]

[tool.ruff]
line-length = 200
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["abides_ui"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow-running (deselect with '-m not slow')",
    "integration: marks tests as integration tests that don't need to run on every file save",
]
addopts = [
    "-v",
    "-m", "not slow and not integration",
    "--cov=src/abides_ui",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-n", "auto",
    "--lf",
]

[tool.coverage.run]
source = ["src/abides_ui"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "src/abides_ui/ui/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.uv.sources]
abides-hasufel = { git = "https://github.com/GabrieleDiCorato/abides-hasufel.git", rev = "v2.5.1" }
